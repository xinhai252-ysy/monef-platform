name: monef
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: monef
      MYSQL_USER: monef
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    # 仅供本机 IDEA 后端和数据库客户端连接，不对局域网开放。
    ports:
      - "127.0.0.1:${MONEF_LOCAL_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONEF_LOCAL_REDIS_PORT:-16379}:6379"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_DATABASE: monef
      MYSQL_USER: monef
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONEF_TENANT: ${MONEF_TENANT:-acme}
      MONEF_ADMIN_EMAIL: ${MONEF_ADMIN_EMAIL:?Set MONEF_ADMIN_EMAIL in .env}
      MONEF_ADMIN_PASSWORD: ${MONEF_ADMIN_PASSWORD:?Set a 12+ character admin password}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      FX_DEMO: ${FX_DEMO:-false}
      FX_LIVE_PROVIDER: ${FX_LIVE_PROVIDER:-exchangerate_dev}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FX_REQUESTS_PER_MINUTE: ${FX_REQUESTS_PER_MINUTE:-7}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 40s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:

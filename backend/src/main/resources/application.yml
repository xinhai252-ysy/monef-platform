server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: monef-api
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      repositories:
        enabled: false
  ai:
    model:
      chat: ${AI_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.1
          max-tokens: 1600
    retry:
      max-attempts: 1
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
monef:
  ai-enabled: ${AI_ENABLED:false}
  seed-demo: false
  fx-demo: false
  redis-enabled: true
  tenant: ${MONEF_TENANT:acme}
  admin-email: ${MONEF_ADMIN_EMAIL:}
  admin-password: ${MONEF_ADMIN_PASSWORD:}
  fx-url: https://api.frankfurter.dev
